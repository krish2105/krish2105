name: sync-readme-footer

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update last-synced timestamp
        run: |
          python3 - <<'PY'
          import re, datetime

          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"(<!--LAST_SYNCED-->)(.*?)(<!--END_LAST_SYNCED-->)",
              lambda m: m.group(1) + now + m.group(3),
              content,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: sync last-updated timestamp"
          git push
