<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roadmap timeline from academic foundations to the current agentic AI portfolio">
  <defs>
    <linearGradient id="rmbg_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="rmdot_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="rmblur_light"><feGaussianBlur stdDeviation="26"/></filter>
    <style><![CDATA[
      .rmbgr_light { fill: url(#rmbg_light); }
      .rmorb_light { filter: url(#rmblur_light); animation: rmPulse_light 7s ease-in-out infinite; }
      @keyframes rmPulse_light { 0%,100% { opacity:0.55; } 50% { opacity: calc(0.55 + .2); } }
      .rmline_light { stroke:#38BDF8; stroke-width:2; stroke-dasharray:1000; stroke-dashoffset:1000; animation: rmDraw_light 3.5s ease-out forwards; }
      @keyframes rmDraw_light { to { stroke-dashoffset:0; } }
      .rm-dot_light { fill:url(#rmdot_light); animation: rmDotPulse_light 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      @keyframes rmDotPulse_light { 0%,100% { transform:scale(1); } 50% { transform:scale(1.3); } }
      .rm-dot-ring_light { fill:none; stroke:#0EA5E9; stroke-opacity:.4; animation: rmRing_light 2.6s ease-out infinite; transform-box: fill-box; transform-origin:center; }
      @keyframes rmRing_light { 0% { transform:scale(.6); opacity:.8; } 100% { transform:scale(1.8); opacity:0; } }
      .rm-card_light { animation: rmFloat_light 5s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      @keyframes rmFloat_light { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      .rm-chip_light { fill:#FFFFFF; stroke:#0EA5E9; stroke-opacity:.55; stroke-width:1; }
      .rm-era_light { font-family: Verdana, 'Segoe UI', sans-serif; font-size:9.5px; font-weight:700; letter-spacing:1.5px; fill:#0369A1; }
      .rm-title_light { font-family: Verdana, 'Segoe UI', sans-serif; font-size:13.5px; font-weight:700; fill:#0F172A; }
      .rm-item_light { font-family: Verdana, 'Segoe UI', sans-serif; font-size:9.5px; fill:#475569; }
    ]]></style>
  </defs>

  <rect class="rmbgr_light" x="0" y="0" width="1200" height="300" rx="20"/>
  <circle class="rmorb_light" cx="100" cy="260" r="90" fill="#C7D2FE"/>
  <circle class="rmorb_light" cx="1100" cy="40" r="100" fill="#BAE6FD" style="animation-delay:2s"/>

  <line class="rmline_light" x1="90" y1="150" x2="1110" y2="150"/>
  <circle cx="1118" cy="150" r="4" fill="#0EA5E9"/>

  
      <g transform="translate(170,150)">
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#0EA5E9" stroke-opacity=".22" stroke-width="1.5"/>
        <circle class="rm-dot_light" r="7" style="animation-delay:0.0s"/>
        <circle class="rm-dot-ring_light" r="14"/>
        <g class="rm-card_light" transform="translate(0,-128)" style="animation-delay:0.0s">
          <rect class="rm-chip_light" x="-95" y="-8" width="190" height="103" rx="12"/>
          <text class="rm-era_light" x="0" y="10" text-anchor="middle">TERM 1</text>
          <text class="rm-title_light" x="0" y="30" text-anchor="middle">Foundations</text>
          <text class="rm-item_light" x="0" y="18" text-anchor="middle">Operations Mgmt</text><text class="rm-item_light" x="0" y="33" text-anchor="middle">DSA</text><text class="rm-item_light" x="0" y="48" text-anchor="middle">Optimization</text>
        </g>
      </g>

      <g transform="translate(450,150)">
        <line x1="0" y1="0" x2="0" y2="10" stroke="#0EA5E9" stroke-opacity=".22" stroke-width="1.5"/>
        <circle class="rm-dot_light" r="7" style="animation-delay:0.35s"/>
        <circle class="rm-dot-ring_light" r="14"/>
        <g class="rm-card_light" transform="translate(0,34)" style="animation-delay:0.35s">
          <rect class="rm-chip_light" x="-95" y="-8" width="190" height="88" rx="12"/>
          <text class="rm-era_light" x="0" y="10" text-anchor="middle">TERM 2</text>
          <text class="rm-title_light" x="0" y="30" text-anchor="middle">Applied ML</text>
          <text class="rm-item_light" x="0" y="18" text-anchor="middle">StreamFlix</text><text class="rm-item_light" x="0" y="33" text-anchor="middle">NLP Assignments</text>
        </g>
      </g>

      <g transform="translate(730,150)">
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#0EA5E9" stroke-opacity=".22" stroke-width="1.5"/>
        <circle class="rm-dot_light" r="7" style="animation-delay:0.7s"/>
        <circle class="rm-dot-ring_light" r="14"/>
        <g class="rm-card_light" transform="translate(0,-128)" style="animation-delay:0.7s">
          <rect class="rm-chip_light" x="-95" y="-8" width="190" height="118" rx="12"/>
          <text class="rm-era_light" x="0" y="10" text-anchor="middle">TERM 3</text>
          <text class="rm-title_light" x="0" y="30" text-anchor="middle">Shipping</text>
          <text class="rm-item_light" x="0" y="18" text-anchor="middle">FraudShield AI</text><text class="rm-item_light" x="0" y="33" text-anchor="middle">Wafa</text><text class="rm-item_light" x="0" y="48" text-anchor="middle">Retail IQ</text><text class="rm-item_light" x="0" y="63" text-anchor="middle">DARIX AI</text>
        </g>
      </g>

      <g transform="translate(1010,150)">
        <line x1="0" y1="0" x2="0" y2="10" stroke="#0EA5E9" stroke-opacity=".22" stroke-width="1.5"/>
        <circle class="rm-dot_light" r="7" style="animation-delay:1.05s"/>
        <circle class="rm-dot-ring_light" r="14"/>
        <g class="rm-card_light" transform="translate(0,34)" style="animation-delay:1.05s">
          <rect class="rm-chip_light" x="-95" y="-8" width="190" height="103" rx="12"/>
          <text class="rm-era_light" x="0" y="10" text-anchor="middle">NOW</text>
          <text class="rm-title_light" x="0" y="30" text-anchor="middle">Agentic Buildout</text>
          <text class="rm-item_light" x="0" y="18" text-anchor="middle">9-Venture Portfolio</text><text class="rm-item_light" x="0" y="33" text-anchor="middle">Sani</text><text class="rm-item_light" x="0" y="48" text-anchor="middle">Wasl AI</text>
        </g>
      </g>
</svg>
