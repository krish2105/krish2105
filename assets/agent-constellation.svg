<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agentic Decision Intelligence project constellation">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1224"/>
      <stop offset="55%" stop-color="#131B3A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="26"/></filter>
    <style>
      <![CDATA[
      .bg { fill: url(#bgGrad); }
      .orb { filter: url(#softBlur); animation: orbPulse 7s ease-in-out infinite; }
      @keyframes orbPulse { 0%,100% { opacity:.28; } 50% { opacity:.5; } }
      .ring {
        fill: none; stroke: #22D3EE; stroke-opacity: .28; stroke-width: 1.4; stroke-dasharray: 3 10;
        transform-box: view-box; transform-origin: 450px 450px;
        animation: ringSpin 140s linear infinite reverse;
      }
      @keyframes ringSpin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
      .hub-pulse {
        transform-box: fill-box; transform-origin: center;
        animation: hubPulse 3.6s ease-in-out infinite;
      }
      @keyframes hubPulse { 0%,100% { transform: scale(1); opacity:.85;} 50% { transform: scale(1.18); opacity:1;} }
      .hub-title { font-family: Verdana, 'Segoe UI', sans-serif; font-weight:700; font-size:22px; fill:#E2E8F0; text-anchor:middle; }
      .hub-sub { font-family: Verdana, 'Segoe UI', sans-serif; font-size:12px; letter-spacing:1.5px; fill:#67E8F9; text-anchor:middle; }
      .orbit-center { transform-box: view-box; transform-origin: 450px 450px; }
      .orbiter {
        animation-name: orbitPath;
        animation-duration: 90s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .node-dot { fill: url(#dotGrad); }
      .node-chip { fill:#111C3D; stroke:#22D3EE; stroke-opacity:.45; stroke-width:1; }
      .node-title { font-family: Verdana, 'Segoe UI', sans-serif; font-size:12.5px; font-weight:700; fill:#E2E8F0; }
      .node-sub { font-family: Verdana, 'Segoe UI', sans-serif; font-size:9.5px; fill:#94A3B8; }
      @keyframes orbitPath {
        0.0% { transform: translate(280.0px, 0.0px); }
        4.167% { transform: translate(270.46px, 72.47px); }
        8.333% { transform: translate(242.49px, 140.0px); }
        12.5% { transform: translate(197.99px, 197.99px); }
        16.667% { transform: translate(140.0px, 242.49px); }
        20.833% { transform: translate(72.47px, 270.46px); }
        25.0% { transform: translate(0.0px, 280.0px); }
        29.167% { transform: translate(-72.47px, 270.46px); }
        33.333% { transform: translate(-140.0px, 242.49px); }
        37.5% { transform: translate(-197.99px, 197.99px); }
        41.667% { transform: translate(-242.49px, 140.0px); }
        45.833% { transform: translate(-270.46px, 72.47px); }
        50.0% { transform: translate(-280.0px, 0.0px); }
        54.167% { transform: translate(-270.46px, -72.47px); }
        58.333% { transform: translate(-242.49px, -140.0px); }
        62.5% { transform: translate(-197.99px, -197.99px); }
        66.667% { transform: translate(-140.0px, -242.49px); }
        70.833% { transform: translate(-72.47px, -270.46px); }
        75.0% { transform: translate(-0.0px, -280.0px); }
        79.167% { transform: translate(72.47px, -270.46px); }
        83.333% { transform: translate(140.0px, -242.49px); }
        87.5% { transform: translate(197.99px, -197.99px); }
        91.667% { transform: translate(242.49px, -140.0px); }
        95.833% { transform: translate(270.46px, -72.47px); }
        100.0% { transform: translate(280.0px, -0.0px); }
      }
      ]]>
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="900" rx="24"/>
  <circle class="orb" cx="120" cy="120" r="140" fill="#6366F1"/>
  <circle class="orb" cx="780" cy="780" r="160" fill="#22D3EE" style="animation-delay:2.2s"/>

  <circle class="ring" cx="450" cy="450" r="280"/>
  <circle class="ring" cx="450" cy="450" r="240" opacity=".5"/>

  <g class="orbit-center">
      <g class="orbiter" style="animation-delay:-0.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Halqa AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Retail retention - 14 agents</text>
      </g>

      <g class="orbiter" style="animation-delay:-10.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Masar AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Transit RAG - LangGraph</text>
      </g>

      <g class="orbiter" style="animation-delay:-20.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Sentinel AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">LLM red-team - OWASP</text>
      </g>

      <g class="orbiter" style="animation-delay:-30.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Nexus BI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Autonomous analyst copilot</text>
      </g>

      <g class="orbiter" style="animation-delay:-40.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Muraqib AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Agentic governance</text>
      </g>

      <g class="orbiter" style="animation-delay:-50.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">ClaimGuard AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Claims intelligence</text>
      </g>

      <g class="orbiter" style="animation-delay:-60.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Sakan AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Dubai real estate intel</text>
      </g>

      <g class="orbiter" style="animation-delay:-70.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Wasl AI</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Agent-to-agent protocol</text>
      </g>

      <g class="orbiter" style="animation-delay:-80.0s;">
        <circle class="node-dot" r="6"/>
        <rect class="node-chip" x="-72" y="12" width="144" height="40" rx="10"/>
        <text class="node-title" x="0" y="27" text-anchor="middle">Sani (Sane)</text>
        <text class="node-sub" x="0" y="42" text-anchor="middle">Agentic coding CLI</text>
      </g>
  </g>

  <circle class="hub-pulse" cx="450" cy="450" r="70" fill="url(#hubGlow)"/>
  <circle cx="450" cy="450" r="46" fill="#111C3D" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.5"/>
  <text class="hub-title" x="450" y="446">Agentic</text>
  <text class="hub-title" x="450" y="470">Decision AI</text>
  <text class="hub-sub" x="450" y="520">9 VENTURES - 1 PORTFOLIO DOMAIN</text>
</svg>