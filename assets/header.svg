<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Krishna Mathur, applied AI and machine learning for business decisions, Dubai UAE">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#101B2D"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">

    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1">
      <path d="M0 52 H1000 M0 104 H1000 M0 156 H1000 M0 208 H1000"/>
      <path d="M60 0 V260 M160 0 V260 M260 0 V260 M360 0 V260 M460 0 V260 M560 0 V260 M660 0 V260 M760 0 V260 M860 0 V260 M960 0 V260"/>
    </g>

    <!-- slow light sweep across the card -->
    <rect x="-420" y="0" width="420" height="260" fill="url(#sweep)">
      <animate attributeName="x" values="-420;1000" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= LEFT: identity ================= -->
    <text x="56" y="96" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="46" font-weight="700" letter-spacing="1.5" fill="url(#nameGrad)">
      KRISHNA MATHUR
    </text>

    <!-- animated underline that draws in, then holds -->
    <path d="M58 116 H452" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="394" stroke-dashoffset="394">
      <animate attributeName="stroke-dashoffset" values="394;0;0;394" dur="9s"
               keyTimes="0;0.28;0.9;1" repeatCount="indefinite"/>
    </path>

    <text x="58" y="150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="600" fill="#E2E8F0" letter-spacing="0.3">
      Applied AI &amp; Machine Learning for business decisions
    </text>

    <text x="58" y="180" font-family="'SF Mono', 'Fira Code', Consolas, monospace"
          font-size="14.5" fill="#94A3B8" letter-spacing="0.4">
      Fraud &amp; risk models  ·  Multilingual NLP  ·  Forecasting dashboards
    </text>

    <!-- location + blinking cursor -->
    <text x="58" y="212" font-family="'SF Mono', 'Fira Code', Consolas, monospace"
          font-size="14" fill="#F59E0B" letter-spacing="0.6">
      Dubai, UAE
    </text>
    <rect x="148" y="200" width="9" height="16" fill="#F59E0B" rx="1">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= RIGHT: signal to decision ================= -->
    <g transform="translate(600,0)">

      <!-- neural nodes (the "signal" side) -->
      <g>
        <!-- edges -->
        <g stroke="#38BDF8" stroke-opacity="0.30" stroke-width="1.2" fill="none">
          <path d="M40 78 L118 60 M40 78 L118 130 M40 130 L118 60 M40 130 L118 130 M40 182 L118 130 M40 182 L118 190"
                stroke-dasharray="6 7">
            <animate attributeName="stroke-dashoffset" values="52;0" dur="2.6s" repeatCount="indefinite"/>
          </path>
          <path d="M118 60 L196 96 M118 130 L196 96 M118 130 L196 160 M118 190 L196 160"
                stroke-dasharray="6 7">
            <animate attributeName="stroke-dashoffset" values="52;0" dur="2.2s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- input layer -->
        <g fill="#38BDF8">
          <circle cx="40" cy="78" r="5">
            <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="40" cy="130" r="5">
            <animate attributeName="r" values="4;7;4" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="40" cy="182" r="5">
            <animate attributeName="r" values="4;7;4" dur="2.8s" begin="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="1s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- hidden layer -->
        <g fill="#2DD4BF">
          <circle cx="118" cy="60" r="5.5">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="118" cy="130" r="5.5">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
          </circle>
          <circle cx="118" cy="190" r="5.5">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- output nodes -->
        <g fill="#F59E0B" filter="url(#soft)">
          <circle cx="196" cy="96" r="6">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="196" cy="160" r="6">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- travelling pulse along the network -->
        <circle r="3.6" fill="#F8FAFC">
          <animateMotion dur="2.4s" repeatCount="indefinite"
                         path="M40 130 L118 60 L196 96"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.6" fill="#F8FAFC">
          <animateMotion dur="2.9s" begin="1.1s" repeatCount="indefinite"
                         path="M40 182 L118 130 L196 160"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- arrow into the decision side -->
      <path d="M216 128 H250" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M244 122 L252 128 L244 134" fill="none" stroke="#475569" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- decision output: bars -->
      <g>
        <rect x="272" y="196" width="16" height="0" rx="3" fill="url(#barGrad)">
          <animate attributeName="height" values="0;44;44;0" dur="6s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
          <animate attributeName="y" values="196;152;152;196" dur="6s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
        </rect>
        <rect x="300" y="196" width="16" height="0" rx="3" fill="url(#barGrad)">
          <animate attributeName="height" values="0;78;78;0" dur="6s" begin="0.18s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
          <animate attributeName="y" values="196;118;118;196" dur="6s" begin="0.18s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
        </rect>
        <rect x="328" y="196" width="16" height="0" rx="3" fill="url(#barGrad)">
          <animate attributeName="height" values="0;58;58;0" dur="6s" begin="0.36s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
          <animate attributeName="y" values="196;138;138;196" dur="6s" begin="0.36s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
        </rect>
        <rect x="356" y="196" width="16" height="0" rx="3" fill="#F59E0B">
          <animate attributeName="height" values="0;104;104;0" dur="6s" begin="0.54s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
          <animate attributeName="y" values="196;92;92;196" dur="6s" begin="0.54s" keyTimes="0;0.2;0.85;1" repeatCount="indefinite"/>
        </rect>

        <!-- baseline -->
        <path d="M266 197 H380" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <text x="272" y="222" font-family="'SF Mono', 'Fira Code', Consolas, monospace"
            font-size="11.5" fill="#64748B" letter-spacing="0.5">DECISION</text>
      <text x="34" y="222" font-family="'SF Mono', 'Fira Code', Consolas, monospace"
            font-size="11.5" fill="#64748B" letter-spacing="0.5">SIGNAL</text>
    </g>

    <!-- border -->
    <rect x="0.75" y="0.75" width="998.5" height="258.5" rx="18" fill="none"
          stroke="#1E293B" stroke-width="1.5"/>
  </g>
</svg>
