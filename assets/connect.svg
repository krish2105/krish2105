<text x="40" y="104" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="900" fill="#e8f5ee">LET'S BUILD SOMETHING</text>
<text x="40" y="150" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="900" fill="url(#tx)">THAT ACTUALLY SHIPS.</text>
<text x="40" y="184" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8fa398">Hiring for an AI/ML role in the UAE, or have an idea worth prototyping? Message me.</text>
