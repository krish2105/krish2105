<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Let's build something that actually ships">
<title>Let's build something that actually ships</title>
<defs><linearGradient id="tx" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="360" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#9dffc2"/><stop offset=".5" stop-color="#3ddc84"/><stop offset="1" stop-color="#9dffc2"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="6s" repeatCount="indefinite"/></linearGradient><radialGradient id="cg" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#3ddc84" stop-opacity=".22"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowbig" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
