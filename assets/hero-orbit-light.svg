<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated floating AI agent core">
  <defs>
    <linearGradient id="bg_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="coreGlow_light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeGrad_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="blurBig_light"><feGaussianBlur stdDeviation="34"/></filter>
    <style><![CDATA[
      .bg2 { fill: url(#bg_light); }
      .orb2 { filter: url(#blurBig_light); animation: pulseOrb2 6.5s ease-in-out infinite; }
      @keyframes pulseOrb2 { 0%,100% { opacity:0.55; } 50% { opacity: calc(0.55 + .22); } }
      .core-ring2 { fill:none; stroke:#0EA5E9; stroke-opacity:.22; }
      .core-glow2 { transform-box: fill-box; transform-origin: center; animation: corePulse2 3.4s ease-in-out infinite; }
      @keyframes corePulse2 { 0%,100% { transform: scale(1); opacity:.85; } 50% { transform: scale(1.16); opacity:1; } }
      .flow-line { stroke:#38BDF8; stroke-width:1.4; stroke-dasharray:6 9; opacity:.55; animation: flowDash 3s linear infinite; }
      @keyframes flowDash { to { stroke-dashoffset:-150; } }
      .chip2 { transform-box: fill-box; transform-origin: center; animation: floatY2 5s ease-in-out infinite; }
      .chip2.d1 { animation-delay: 0s; } .chip2.d2 { animation-delay: .7s; }
      .chip2.d3 { animation-delay: 1.4s; } .chip2.d4 { animation-delay: 2.1s; }
      .chip2.d5 { animation-delay: 2.8s; } .chip2.d6 { animation-delay: 3.5s; }
      @keyframes floatY2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
      .particle2 { fill:#0EA5E9; animation: twinkle2 3.6s ease-in-out infinite; }
      @keyframes twinkle2 { 0%,100% { opacity:.12; } 50% { opacity:.8; } }
      .orbit-dot2 { transform-box: view-box; transform-origin: 600px 160px; animation: orbitSpin2 10s linear infinite; }
      .orbit-dot2.rev { animation-direction: reverse; animation-duration: 14s; }
      @keyframes orbitSpin2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .chip-text2 { font-family: Verdana, 'Segoe UI', sans-serif; font-size:15px; fill:#0F172A; font-weight:700; text-anchor:middle; }
      .chip-text2.small { font-size:12.5px; }
    ]]></style>
  </defs>

  <rect class="bg2" x="0" y="0" width="1200" height="320" rx="20"/>
  <circle class="orb2" cx="130" cy="55" r="95" fill="#C7D2FE"/>
  <circle class="orb2" cx="1085" cy="265" r="115" fill="#BAE6FD" style="animation-delay:2.1s"/>

  <ellipse class="core-ring2" cx="600" cy="160" rx="120" ry="120"/>
  <ellipse class="core-ring2" cx="600" cy="160" rx="180" ry="180" opacity=".6"/>

  <line class="flow-line" x1="600" y1="160" x2="230" y2="70"/>
  <line class="flow-line" x1="600" y1="160" x2="230" y2="250"/>
  <line class="flow-line" x1="600" y1="160" x2="970" y2="70"/>
  <line class="flow-line" x1="600" y1="160" x2="970" y2="250"/>
  <line class="flow-line" x1="600" y1="160" x2="600" y2="42"/>
  <line class="flow-line" x1="600" y1="160" x2="600" y2="278"/>

  <circle class="orbit-dot2" cx="720" cy="160" r="4.2" fill="#0EA5E9"/>
  <circle class="orbit-dot2 rev" cx="480" cy="160" r="3.4" fill="#4338CA"/>
  <circle class="orbit-dot2" cx="600" cy="280" r="3.6" fill="#0EA5E9" style="animation-duration:12s"/>

  <circle class="particle2" cx="90" cy="140" r="2"/>
  <circle class="particle2" cx="1125" cy="90" r="2" style="animation-delay:1s"/>
  <circle class="particle2" cx="335" cy="28" r="1.6" style="animation-delay:2s"/>
  <circle class="particle2" cx="905" cy="302" r="2" style="animation-delay:1.6s"/>
  <circle class="particle2" cx="60" cy="250" r="1.6" style="animation-delay:.6s"/>

  <circle class="core-glow2" cx="600" cy="160" r="48" fill="url(#coreGlow_light)"/>
  <circle cx="600" cy="160" r="27" fill="url(#nodeGrad_light)"/>
  <circle cx="600" cy="160" r="27" fill="none" stroke="#E0F2FE" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" style="font-family:Verdana, sans-serif; font-size:11px; fill:#E0F2FE; font-weight:800;">AI</text>

  <g class="chip2 d1"><rect x="150" y="46" width="118" height="40" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity=".55"/><text class="chip-text2" x="209" y="71">Agents</text></g>
  <g class="chip2 d2"><rect x="150" y="228" width="118" height="40" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity=".55"/><text class="chip-text2" x="209" y="253">RAG</text></g>
  <g class="chip2 d3"><rect x="898" y="46" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity=".55"/><text class="chip-text2" x="973" y="71">LangGraph</text></g>
  <g class="chip2 d4"><rect x="898" y="228" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity=".55"/><text class="chip-text2" x="973" y="253">MCP</text></g>
  <g class="chip2 d5"><rect x="530" y="8" width="140" height="36" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity=".55"/><text class="chip-text2 small" x="600" y="31">Decision AI</text></g>
  <g class="chip2 d6"><rect x="524" y="272" width="152" height="36" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-opacity=".55"/><text class="chip-text2 small" x="600" y="295">Agentic RAG</text></g>
</svg>
