<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floating AI agent core visual">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1224"/>
      <stop offset="55%" stop-color="#131B3A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="coreGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="blurBig2"><feGaussianBlur stdDeviation="34"/></filter>
    <style>
      <![CDATA[
      .bg2 { fill: url(#bgGrad2); }
      .orb2 { filter: url(#blurBig2); animation: pulseOrb2 6.5s ease-in-out infinite; }
      @keyframes pulseOrb2 { 0%,100% { opacity:.28; } 50% { opacity:.5; } }

      .core-ring2 { fill:none; stroke:#22D3EE; stroke-opacity:.4; }

      .core-glow2 {
        transform-box: fill-box; transform-origin: center;
        animation: corePulse2 3.4s ease-in-out infinite;
      }
      @keyframes corePulse2 { 0%,100% { transform: scale(1); opacity:.85; } 50% { transform: scale(1.16); opacity:1; } }

      .flow-line { stroke:#67E8F9; stroke-width:1.4; stroke-dasharray:6 9; opacity:.5; animation: flowDash 3s linear infinite; }
      @keyframes flowDash { to { stroke-dashoffset:-150; } }

      .chip2 { transform-box: fill-box; transform-origin: center; animation: floatY2 5s ease-in-out infinite; }
      .chip2.d1 { animation-delay: 0s; }
      .chip2.d2 { animation-delay: .7s; }
      .chip2.d3 { animation-delay: 1.4s; }
      .chip2.d4 { animation-delay: 2.1s; }
      .chip2.d5 { animation-delay: 2.8s; }
      .chip2.d6 { animation-delay: 3.5s; }
      @keyframes floatY2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }

      .particle2 { fill:#67E8F9; animation: twinkle2 3.6s ease-in-out infinite; }
      @keyframes twinkle2 { 0%,100% { opacity:.12; } 50% { opacity:.85; } }

      .orbit-dot2 {
        transform-box: view-box; transform-origin: 600px 160px;
        animation: orbitSpin2 10s linear infinite;
      }
      .orbit-dot2.rev { animation-direction: reverse; animation-duration: 14s; }
      @keyframes orbitSpin2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .chip-text2 { font-family: Verdana, 'Segoe UI', sans-serif; font-size:15px; fill:#E2E8F0; font-weight:700; text-anchor:middle; }
      .chip-text2.small { font-size:12.5px; }
      ]]>
    </style>
  </defs>

  <rect class="bg2" x="0" y="0" width="1200" height="320" rx="20"/>

  <circle class="orb2" cx="130" cy="55" r="95" fill="#6366F1"/>
  <circle class="orb2" cx="1085" cy="265" r="115" fill="#22D3EE" style="animation-delay:2.1s"/>

  <ellipse class="core-ring2" cx="600" cy="160" rx="120" ry="120"/>
  <ellipse class="core-ring2" cx="600" cy="160" rx="180" ry="180" opacity=".3"/>

  <line class="flow-line" x1="600" y1="160" x2="230" y2="70"/>
  <line class="flow-line" x1="600" y1="160" x2="230" y2="250"/>
  <line class="flow-line" x1="600" y1="160" x2="970" y2="70"/>
  <line class="flow-line" x1="600" y1="160" x2="970" y2="250"/>
  <line class="flow-line" x1="600" y1="160" x2="600" y2="42"/>
  <line class="flow-line" x1="600" y1="160" x2="600" y2="278"/>

  <circle class="orbit-dot2" cx="720" cy="160" r="4.2" fill="#67E8F9"/>
  <circle class="orbit-dot2 rev" cx="480" cy="160" r="3.4" fill="#A5B4FC"/>
  <circle class="orbit-dot2" cx="600" cy="280" r="3.6" fill="#22D3EE" style="animation-duration:12s"/>

  <circle class="particle2" cx="90" cy="140" r="2"/>
  <circle class="particle2" cx="1125" cy="90" r="2" style="animation-delay:1s"/>
  <circle class="particle2" cx="335" cy="28" r="1.6" style="animation-delay:2s"/>
  <circle class="particle2" cx="905" cy="302" r="2" style="animation-delay:1.6s"/>
  <circle class="particle2" cx="60" cy="250" r="1.6" style="animation-delay:.6s"/>

  <circle class="core-glow2" cx="600" cy="160" r="48" fill="url(#coreGlow2)"/>
  <circle cx="600" cy="160" r="27" fill="url(#nodeGrad2)"/>
  <circle cx="600" cy="160" r="27" fill="none" stroke="#0B1224" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" style="font-family:Verdana, sans-serif; font-size:11px; fill:#0B1224; font-weight:800;">AI</text>

  <g class="chip2 d1"><rect x="150" y="46" width="118" height="40" rx="10" fill="#111C3D" stroke="#22D3EE" stroke-opacity=".5"/><text class="chip-text2" x="209" y="71">Agents</text></g>
  <g class="chip2 d2"><rect x="150" y="228" width="118" height="40" rx="10" fill="#111C3D" stroke="#6366F1" stroke-opacity=".5"/><text class="chip-text2" x="209" y="253">RAG</text></g>
  <g class="chip2 d3"><rect x="898" y="46" width="150" height="40" rx="10" fill="#111C3D" stroke="#22D3EE" stroke-opacity=".5"/><text class="chip-text2" x="973" y="71">LangGraph</text></g>
  <g class="chip2 d4"><rect x="898" y="228" width="150" height="40" rx="10" fill="#111C3D" stroke="#6366F1" stroke-opacity=".5"/><text class="chip-text2" x="973" y="253">MCP</text></g>
  <g class="chip2 d5"><rect x="530" y="8" width="140" height="36" rx="10" fill="#111C3D" stroke="#67E8F9" stroke-opacity=".5"/><text class="chip-text2 small" x="600" y="31">Decision AI</text></g>
  <g class="chip2 d6"><rect x="524" y="272" width="152" height="36" rx="10" fill="#111C3D" stroke="#67E8F9" stroke-opacity=".5"/><text class="chip-text2 small" x="600" y="295">Agentic RAG</text></g>
</svg>
